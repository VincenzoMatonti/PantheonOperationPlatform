services:

  hermes:
    image: pantheon-hermes:local
    build:
      context: ../..
      dockerfile: infra/local/hermes/Dockerfile
    container_name: pantheon-hermes
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Hermes: Host=postgres;Port=5432;Database=pantheon;Username=pantheon;Password=pantheon
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pantheon-local

  postgres:
    image: postgres:18
    container_name: pantheon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantheon
      POSTGRES_USER: pantheon
      POSTGRES_PASSWORD: pantheon
    ports:
      - "5432:5432"
    volumes:
      - pantheon-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pantheon -d pantheon" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pantheon-local

networks:
  pantheon-local:
    name: pantheon-local

volumes:
  pantheon-postgres-data:
    name: pantheon-postgres-data
