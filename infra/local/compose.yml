services:
  hermes:
    image: pantheon-hermes:local
    build:
      context: ../..
      dockerfile: infra/local/hermes/Dockerfile
    container_name: pantheon-hermes
    env_file:
      - ./hermes/.env
    ports:
      - "${HERMES_HTTP_PORT}:${HERMES_CONTAINER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pantheon-local

  postgres:
    image: postgres:18
    container_name: pantheon-postgres
    restart: unless-stopped
    env_file:
      - ./postgres/.env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - pantheon-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pantheon-local

networks:
  pantheon-local:
    name: pantheon-local

volumes:
  pantheon-postgres-data:
    name: pantheon-postgres-data
