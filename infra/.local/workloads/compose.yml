services:
  hermes:
    image: pantheon-hermes:local
    build:
      context: ../../..
      dockerfile: infra/.local/workloads/hermes/Dockerfile
    container_name: pantheon-hermes
    restart: unless-stopped
    labels:
      com.pantheon.managed: "true"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000001"
      com.pantheon.environment: "local"
      com.pantheon.role: "service"
    env_file:
      - ./hermes/.env
    ports:
      - "${HERMES_HTTP_PORT}:${HERMES_CONTAINER_PORT}"
    networks:
      - pantheon-local

  hephaestus:
    image: pantheon-hephaestus:local
    build:
      context: ../../..
      dockerfile: infra/.local/workloads/hephaestus/Dockerfile
    container_name: pantheon-hephaestus
    restart: unless-stopped
    labels:
      com.pantheon.managed: "true"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000002"
      com.pantheon.environment: "local"
      com.pantheon.role: "service"
    env_file:
      - ./hephaestus/.env
    ports:
      - "${HEPHAESTUS_HTTP_PORT}:${HEPHAESTUS_CONTAINER_PORT}"
    networks:
      - pantheon-local

  hephaestus-worker:
    image: pantheon-hephaestus-worker:local
    build:
      context: ../../..
      dockerfile: infra/.local/workloads/hephaestus-worker/Dockerfile
    container_name: pantheon-hephaestus-worker
    restart: unless-stopped
    labels:
      com.pantheon.managed: "true"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000002"
      com.pantheon.environment: "local"
      com.pantheon.role: "worker"
    env_file:
      - ./hephaestus-worker/.env
    networks:
      - pantheon-local

  argus:
    image: pantheon-argus:local
    build:
      context: ../../..
      dockerfile: infra/.local/workloads/argus/Dockerfile
    container_name: pantheon-argus
    restart: unless-stopped
    labels:
      com.pantheon.managed: "true"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000003"
      com.pantheon.environment: "local"
      com.pantheon.role: "service"
    env_file:
      - ./argus/.env
    ports:
      - "${ARGUS_HTTP_PORT}:${ARGUS_CONTAINER_PORT}"
    networks:
      - pantheon-local

networks:
  pantheon-local:
    external: true
    name: pantheon-local
