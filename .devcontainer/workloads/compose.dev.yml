services:
  hermes-dev:
    image: pantheon-hermes-dev:local
    build:
      context: ../..
      dockerfile: .devcontainer/hermes/Dockerfile
    container_name: pantheon-hermes-dev
    labels:
      com.pantheon.managed: "false"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000001"
      com.pantheon.environment: "development"
      com.pantheon.role: "devcontainer"
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ../../infra/.local/workloads/hermes/.env
    networks:
      - pantheon-local
    command: sleep infinity

  hephaestus-dev:
    image: pantheon-hephaestus-dev:local
    build:
      context: ../..
      dockerfile: .devcontainer/hephaestus/Dockerfile
    container_name: pantheon-hephaestus-dev
    labels:
      com.pantheon.managed: "false"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000002"
      com.pantheon.environment: "development"
      com.pantheon.role: "devcontainer"
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ../../infra/.local/workloads/hephaestus/.env
    networks:
      - pantheon-local
    command: sleep infinity

  hephaestus-worker-dev:
    image: pantheon-hephaestus-worker-dev:local
    build:
      context: ../..
      dockerfile: .devcontainer/hephaestus-worker/Dockerfile
    container_name: pantheon-hephaestus-worker-dev
    labels:
      com.pantheon.managed: "false"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000002"
      com.pantheon.environment: "development"
      com.pantheon.role: "devcontainer"
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ../../infra/.local/workloads/hephaestus-worker/.env
    networks:
      - pantheon-local
    command: sleep infinity

  argus-dev:
    image: pantheon-argus-dev:local
    build:
      context: ../..
      dockerfile: .devcontainer/argus/Dockerfile
    container_name: pantheon-argus-dev
    labels:
      com.pantheon.managed: "false"
      com.pantheon.system-id: "10000000-0000-0000-0000-000000000003"
      com.pantheon.environment: "development"
      com.pantheon.role: "devcontainer"
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ../../infra/.local/workloads/argus/.env
    networks:
      - pantheon-local
    command: sleep infinity

networks:
  pantheon-local:
    external: true
    name: pantheon-local
