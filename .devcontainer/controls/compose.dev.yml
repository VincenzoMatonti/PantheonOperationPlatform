services:
  athena-dev:
    image: pantheon-athena-dev:local
    build:
      context: ../..
      dockerfile: .devcontainer/athena/Dockerfile
    container_name: pantheon-athena-dev
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ../../infra/.local/controls/athena/.env
    networks:
      - pantheon-local
    command: sleep infinity

networks:
  pantheon-local:
    external: true
    name: pantheon-local
