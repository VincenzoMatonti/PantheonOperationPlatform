services:
  hermes:
    build:
      context: ../..
      dockerfile: .devcontainer/hermes/Dockerfile
    container_name: pantheon-hermes-dev
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ./hermes/.env
    networks:
      - pantheon-local
    command: sleep infinity

  hephaestus:
    build:
      context: ../..
      dockerfile: .devcontainer/hephaestus/Dockerfile
    container_name: pantheon-hephaestus-dev
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ./hephaestus/.env
    networks:
      - pantheon-local
    command: sleep infinity

  hephaestus-worker:
    build:
      context: ../..
      dockerfile: .devcontainer/hephaestus-worker/Dockerfile
    container_name: pantheon-hephaestus-worker-dev
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    env_file:
      - ./hephaestus-worker/.env
    networks:
      - pantheon-local
    command: sleep infinity

networks:
  pantheon-local:
    external: true
