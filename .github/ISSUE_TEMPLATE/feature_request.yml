name: Feature request
description: Propose a new capability or improvement for Pantheon.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Describe the problem or use case first, then explain the capability you would like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Describe the problem, limitation, or use case that this feature would address.
      placeholder: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the capability or behavior you would like Pantheon to provide.
      placeholder: What would you like Pantheon to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions or workarounds you have considered.
      placeholder: What alternatives or workarounds exist?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of Pantheon would be affected?
      options:
        - Application
        - Architecture
        - Infrastructure
        - Security
        - Database
        - DevOps
        - Observability
        - Integration
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
      description: Describe the expected impact on Pantheon, its architecture, infrastructure, or users.
      placeholder: What would this change improve or affect?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add examples, references, diagrams, related issues, or other useful information.
      placeholder: Add any additional context here.
    validations:
      required: false
